[project]
name = "weex-autotrade"
version = "0.1.0"
description = "Safety-first WEEX contract trading CLI with demo and live modes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.58",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
weex = "weex_cli.cli:app"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.13.0",
    "markdownify>=1.2.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weex_cli"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["weex_cli"]

[tool.coverage.report]
show_missing = true
skip_covered = true
