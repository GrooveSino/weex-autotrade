[project]
name = "weex-fleet-control-plane"
version = "0.1.0"
description = "Mock-first multi-account control plane for WEEX Fleet."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
    "weex-autotrade",
]

[tool.uv.sources]
# The control plane and executor share the CLI's execution-event projection.
# Keep this local source editable so a service release cannot silently use a
# stale wheel after the shared event schema changes.
weex-autotrade = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src", "../../src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
